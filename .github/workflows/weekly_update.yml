name: Weekly Council Data Update

on:
  schedule:
    - cron: '0 14 * * 5'  # Every Friday at 2:00 PM UTC (10:00 AM ET)
  workflow_dispatch:        # Also allows manual trigger from GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic beautifulsoup4

      - name: Run update pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 update_pipeline.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add council_data.json cincinnati_agenda_items_complete.csv
          git diff --staged --quiet || git commit -m "Weekly data update $(date +'%Y-%m-%d')"
          git push
