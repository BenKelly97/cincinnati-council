<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cincinnati City Council — Member Voting Records</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f6f3;--bg3:#f0efe9;
  --text:#1a1a18;--text2:#5a5a55;--text3:#9a9a92;
  --border:#e0dfd8;--border2:#c8c7be;
  --green-bg:#e6f4ec;--green-text:#1a5c35;
  --red-bg:#fceaea;--red-text:#8a1a1a;
  --amber-bg:#fef3e2;--amber-text:#7a4a0a;
  --blue-bg:#e8f0fb;--blue-text:#1a4a8a;
  --accent:#2255cc;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c28;
    --text:#f0efe8;--text2:#a0a098;--text3:#606058;
    --border:#3a3a35;--border2:#4a4a45;
    --green-bg:#0d2a18;--green-text:#6acf96;
    --red-bg:#2a0d0d;--red-text:#f08080;
    --amber-bg:#2a1a06;--amber-text:#f0c070;
    --blue-bg:#0d2040;--blue-text:#7aaaf0;
    --accent:#6699ff;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg3);color:var(--text);min-height:100vh;font-size:15px}
.shell{max-width:960px;margin:0 auto;padding:0 1rem}
header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;gap:1rem;padding:0.75rem 0}
.logo{font-size:15px;font-weight:600;color:var(--text)}
.logo span{color:var(--text3);font-weight:400}
.back-link{font-size:13px;color:var(--accent);margin-left:auto;text-decoration:none}
main{padding:1.5rem 0 3rem}

/* Member grid */
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:2rem}
.member-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color 0.12s}
.member-card:hover,.member-card.active{border-color:var(--accent)}
.member-card.active{background:var(--blue-bg)}
.member-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:8px}
.member-stats{display:flex;gap:8px;flex-wrap:wrap}
.stat-pill{font-size:11px;font-weight:500;padding:2px 8px;border-radius:12px}
.pill-yes{background:var(--green-bg);color:var(--green-text)}
.pill-no{background:var(--red-bg);color:var(--red-text)}
.pill-abstain{background:var(--amber-bg);color:var(--amber-text)}
.pill-total{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.bar-wrap{margin-top:8px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.bar-yes{height:100%;background:var(--green-text);border-radius:2px}

/* Vote list */
.vote-list-header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.vote-list-title{font-size:16px;font-weight:500}
.filter-group{display:flex;gap:6px;margin-left:auto}
.filter-btn{font-size:12px;padding:4px 12px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--text2);cursor:pointer}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.vote-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:6px;transition:border-color 0.12s,box-shadow 0.12s}
.vote-item:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.card-title{font-size:14px;font-weight:500;color:var(--text);line-height:1.4;flex:1}
.card-date{font-size:12px;color:var(--text3);white-space:nowrap;padding-top:2px;flex-shrink:0}
.card-summary{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.card-footer{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap;line-height:1.6}
.b-topic{background:var(--blue-bg);color:var(--blue-text)}
.b-action{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.b-geo{background:var(--green-bg);color:var(--green-text)}
.vote-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.badge-yes{background:var(--green-bg);color:var(--green-text)}
.badge-no{background:var(--red-bg);color:var(--red-text)}
.badge-abstain{background:var(--amber-bg);color:var(--amber-text)}
.badge-neutral{background:var(--bg2);color:var(--text3);border:1px solid var(--border)}

.empty{text-align:center;padding:2rem;color:var(--text2);font-size:14px}
.loading{text-align:center;padding:3rem;color:var(--text3);font-size:14px}
.section-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:1rem}
.b-pass{background:var(--green-bg);color:var(--green-text)}
.b-fail{background:var(--red-bg);color:var(--red-text)}
.b-pending{background:var(--amber-bg);color:var(--amber-text)}
.b-neutral{background:var(--bg2);color:var(--text2)}
</style>
</head>
<body>
<header>
  <div class="shell">
    <div class="header-inner">
      <div class="logo">Cincinnati City Council <span>/ Member Voting Records</span></div>
      <a href="index.html" class="back-link">← All Legislation</a>
    </div>
  </div>
</header>
<main>
  <div class="shell">
    <div id="content"><div class="loading">Loading records…</div></div>
  </div>
</main>
<script>
let ALL = [];
let VOTES = {}; // file_number -> vote record
let selectedMember = null;
let voteFilter = 'all';

// Full name lookup — extended with historical members
const FULL_NAMES = {
  'Albi': 'Councilmember Anna Albi',
  'Walsh': 'Councilmember Seth Walsh',
  'Johnson': 'Councilmember Scotty Johnson',
  'Cramerding': 'Councilmember Jeff Cramerding',
  'Jeffreys': 'Councilmember Mark Jeffreys',
  'Owens': 'Councilmember Meeka Owens',
  'Nolan': 'Councilmember Evan Nolan',
  'Parks': 'Councilmember Victoria Parks',
  'Kearney': 'Vice Mayor Jan-Michele Kearney',
  'Landsman': 'Councilmember Greg Landsman',
  'Seelbach': 'Councilmember Chris Seelbach',
  'Sittenfeld': 'Councilmember P.G. Sittenfeld',
  'Mann': 'Councilmember David Mann',
  'Harris': 'Councilmember Reggie Harris',
  'Smitherman': 'Councilmember Christopher Smitherman',
  'Sundermann': 'Councilmember Betsy Sundermann',
  'Young': 'Councilmember Wendell Young',
  'Pastor': 'Councilmember Jeff Pastor',
  'Keating': 'Councilmember Liz Keating',
  'James': 'Councilmember Ryan James',
  'Goodin': 'Councilmember Steve Goodin',
  'Cranley': 'Mayor John Cranley',
};

// Members to exclude from the grid (mayors who appear in vote records)
const EXCLUDE_MEMBERS = new Set(['Cranley']);

// Will be populated dynamically from vote data
let MEMBERS = [];

function getMemberStats(name) {
  let yes = 0, no = 0, abstain = 0, absent = 0, excused = 0;
  Object.values(VOTES).forEach(v => {
    if ((v.vote_yes||[]).includes(name)) yes++;
    else if ((v.vote_no||[]).includes(name)) no++;
    else if ((v.vote_abstain||[]).includes(name)) abstain++;
    else if ((v.vote_absent||[]).includes(name)) absent++;
    else if ((v.vote_excused||[]).includes(name)) excused++;
  });
  return {yes, no, abstain, absent, excused, total: yes+no+abstain+absent+excused};
}

function getMemberVotes(name) {
  return ALL.filter(r => {
    if (!r.vote_yes) return false;
    if ((r.vote_yes||[]).includes(name)) return true;
    if ((r.vote_no||[]).includes(name)) return true;
    if ((r.vote_abstain||[]).includes(name)) return true;
    if ((r.vote_absent||[]).includes(name)) return true;
    if ((r.vote_excused||[]).includes(name)) return true;
    return false;
  });
}

function getVoteType(r, name) {
  if ((r.vote_yes||[]).includes(name)) return 'yes';
  if ((r.vote_no||[]).includes(name)) return 'no';
  if ((r.vote_abstain||[]).includes(name)) return 'abstain';
  if ((r.vote_absent||[]).includes(name)) return 'absent';
  if ((r.vote_excused||[]).includes(name)) return 'excused';
  return null;
}

function render() {
  const members = MEMBERS;

  // Get year range from vote data
  const dates = ALL.filter(r => r.vote_yes && r.d).map(r => r.d);
  const minYear = dates.length ? dates[dates.length-1].slice(0,4) : '2020';
  const maxYear = dates.length ? dates[0].slice(0,4) : '2026';
  const rangeLabel = minYear === maxYear ? minYear : `${minYear}–${maxYear}`;

  let html = `<div class="section-title">Voting Record ${rangeLabel} — Select a member</div>`;

  function memberCard(name) {
    const s = getMemberStats(name);
    const yesPct = s.total ? Math.round(s.yes/s.total*100) : 0;
    const isActive = selectedMember === name;
    return `<div class="member-card ${isActive?'active':''}" onclick="selectMember('${name}')">
      <div class="member-name">${name}</div>
      <div class="member-stats">
        <span class="stat-pill pill-total">${s.total} votes</span>
        <span class="stat-pill pill-yes">${s.yes} yes</span>
        ${s.no ? `<span class="stat-pill pill-no">${s.no} no</span>` : ''}
        ${s.abstain ? `<span class="stat-pill pill-abstain">${s.abstain} abstain</span>` : ''}
        ${s.absent ? `<span class="stat-pill" style="background:var(--bg2);color:var(--text3);border:1px solid var(--border)">${s.absent} absent</span>` : ''}
        ${s.excused ? `<span class="stat-pill" style="background:var(--bg2);color:var(--text3);border:1px solid var(--border)">${s.excused} excused</span>` : ''}
      </div>
      <div class="bar-wrap"><div class="bar-yes" style="width:${yesPct}%"></div></div>
    </div>`;
  }

  html += '<div class="section-title" style="margin-top:0.5rem">Current Members</div>';
  html += '<div class="member-grid">';
  members.slice(0, 9).forEach(name => { html += memberCard(name); });
  html += '</div>';

  html += '<div class="section-title" style="margin-top:1rem">Former Members</div>';
  html += '<div class="member-grid">';
  members.slice(9).forEach(name => { html += memberCard(name); });
  html += '</div>';

  if (selectedMember) {
    html += '<div id="vote-list-anchor"></div>';
    const votes = getMemberVotes(selectedMember);
    const filtered = voteFilter === 'all' ? votes : votes.filter(r => getVoteType(r, selectedMember) === voteFilter);
    const noCount = votes.filter(r => getVoteType(r, selectedMember) === 'no').length;
    const abstainCount = votes.filter(r => getVoteType(r, selectedMember) === 'abstain').length;
    const absentCount = votes.filter(r => getVoteType(r, selectedMember) === 'absent').length;
    const excusedCount = votes.filter(r => getVoteType(r, selectedMember) === 'excused').length;

    html += `<div class="vote-list-header">
      <div class="vote-list-title">${FULL_NAMES[selectedMember] || selectedMember}</div>
      <div class="filter-group">
        <button class="filter-btn ${voteFilter==='all'?'active':''}" onclick="setFilter('all')">All (${votes.length})</button>
        ${noCount ? `<button class="filter-btn ${voteFilter==='no'?'active':''}" onclick="setFilter('no')">No votes (${noCount})</button>` : ''}
        ${abstainCount ? `<button class="filter-btn ${voteFilter==='abstain'?'active':''}" onclick="setFilter('abstain')">Abstain (${abstainCount})</button>` : ''}
        ${absentCount ? `<button class="filter-btn ${voteFilter==='absent'?'active':''}" onclick="setFilter('absent')">Absent (${absentCount})</button>` : ''}
        ${excusedCount ? `<button class="filter-btn ${voteFilter==='excused'?'active':''}" onclick="setFilter('excused')">Excused (${excusedCount})</button>` : ''}
      </div>
    </div>`;

    if (filtered.length === 0) {
      html += '<div class="empty">No votes match this filter</div>';
    } else {
      filtered.sort((a,b) => (b.d||'').localeCompare(a.d||''));
      filtered.forEach(r => {
        const vtype = getVoteType(r, selectedMember);
        const badgeClass = vtype === 'yes' ? 'badge-yes' : vtype === 'no' ? 'badge-no' : vtype === 'abstain' ? 'badge-abstain' : 'badge-neutral';
        const badgeLabel = vtype === 'yes' ? 'Yes' : vtype === 'no' ? 'No' : vtype === 'abstain' ? 'Abstain' : vtype === 'excused' ? 'Excused' : 'Absent';
        const others_no = (r.vote_no||[]).filter(m => m !== selectedMember);
        const minority = vtype === 'no' && others_no.length ? `<span style="color:var(--text3)"> · also no: ${others_no.join(', ')}</span>` : '';
        const legistarLink = r.legistar_url ? `<a href="${r.legistar_url}" target="_blank" style="font-size:12px;color:var(--accent);margin-left:8px;white-space:nowrap;font-weight:400">↗ Legistar</a>` : '';
        const topics = r.tp ? r.tp.split('|').map(t => `<span class="tag b-topic">${t}</span>`).join('') : '';
        const actionBadge = r.a ? `<span class="tag b-action">${r.a}</span>` : '';
        const geo = r.g ? r.g.split('|').filter(g => g && g !== 'citywide').map(g => `<span class="tag b-geo">${g}</span>`).join('') : '';
        const rawStatus = r.st || '';
        // Skip committee referral strings (all-caps, long)
        const showStatus = rawStatus && !(rawStatus === rawStatus.toUpperCase() && rawStatus.length > 20);
        const statusClass = (() => {
          const l = rawStatus.toLowerCase();
          if (l.includes('pass') || l === 'adopted' || l === 'confirmed') return 'b-pass';
          if (l.includes('fail') || l.includes('postponed')) return 'b-fail';
          if (l === 'filed' || l === 'filed/sunset' || l === 'sunset') return 'b-neutral';
          return 'b-pending';
        })();
        html += `<div class="vote-item">
          <div class="card-header">
            <span class="vote-badge ${badgeClass}" style="flex-shrink:0;margin-top:2px">${badgeLabel}</span>
            <div class="card-title">${r.t || r.f}${legistarLink}${minority}</div>
            <div class="card-date">${r.d || ''}</div>
          </div>
          ${r.sm ? `<div class="card-summary">${r.sm}</div>` : ''}
          <div class="card-footer">
            ${topics}${actionBadge}${geo}
            ${showStatus ? `<span class="tag ${statusClass}">${rawStatus}</span>` : ''}
          </div>
        </div>`;
      });
    }
  }

  document.getElementById('content').innerHTML = html;
}

function selectMember(name) {
  selectedMember = selectedMember === name ? null : name;
  voteFilter = 'all';
  render();
  if (selectedMember) {
    const el = document.getElementById('vote-list-anchor');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function setFilter(f) {
  voteFilter = f;
  render();
}

async function loadData() {
  const resp = await fetch('council_data.json');
  const raw = await resp.json();
  if (raw[0] && raw[0]._meta) raw.shift();
  ALL = raw;
  // Build vote lookup
  ALL.forEach(r => {
    if (r.vote_yes) VOTES[r.f] = r;
  });
  // Build dynamic member list from whoever appears in vote data
  const memberSet = new Set();
  Object.values(VOTES).forEach(v => {
    [...(v.vote_yes||[]), ...(v.vote_no||[]), ...(v.vote_abstain||[]), ...(v.vote_absent||[])].forEach(m => memberSet.add(m));
  });
  // Sort: current members first (in FULL_NAMES order), then historical alphabetically
  const currentMembers = ['Albi','Walsh','Johnson','Cramerding','Jeffreys','Owens','Nolan','Parks','Kearney'];
  const current = currentMembers.filter(m => memberSet.has(m));
  const historical = [...memberSet].filter(m => !currentMembers.includes(m) && !EXCLUDE_MEMBERS.has(m)).sort();
  MEMBERS = [...current, ...historical];
  render();
}

loadData();
</script>
</body>
</html>
